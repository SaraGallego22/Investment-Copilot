[project]
name = "collaborative-partner"
version = "0.1.0"
description = "Agente con memoria persistente y RAG — All Things Agentic Hackathon, track The Collaborative Partner"
requires-python = ">=3.11"
dependencies = [
    "google-adk",
    "google-cloud-firestore",
    "google-cloud-aiplatform",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collaborative_partner*"]
